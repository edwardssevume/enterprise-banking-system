spring:
  application:
    name: account-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:account_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

security:
  jwt:
    secret: "VGhpc0lzQVRlc3RTZWNyZXRLZXlGb3JKV1RUZXN0aW5nMTIzNDU2"
    issuer: "enterprise-banking-auth-service"

internal:
  service:
    secret: "test-internal-service-secret"