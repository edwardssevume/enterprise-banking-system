spring:
  application:
    name: account-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:account_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

security:
  jwt:
    secret: "${TEST_JWT_SECRET:yK8e+qYf3xf2TqPVQukXf0+SMa9Krer8Z0Ks9LkHFZpb/3FKUJhu3p9e3fi/DFny}"
    issuer: "enterprise-banking-auth-service"

internal:
  service:
    secret: "${TEST_INTERNAL_SERVICE_SECRET:local-test-only-internal-service-key-do-not-use-in-production-2026}"