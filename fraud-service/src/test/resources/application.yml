spring:
  application:
    name: fraud-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:fraud_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    consumer:
      group-id: fraud-service-test-group
      auto-offset-reset: earliest

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: "${TEST_JWT_SECRET:yK8e+qYf3xf2TqPVQukXf0+SMa9Krer8Z0Ks9LkHFZpb/3FKUJhu3p9e3fi/DFny}"
  issuer: "enterprise-banking-auth-service"