apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: enterprise-bank

spec:
  replicas: 1

  selector:
    matchLabels:
      app: discovery-server

  template:
    metadata:
      labels:
        app: discovery-server

    spec:
      containers:
        - name: discovery-server
          image: 783772617204.dkr.ecr.ca-central-1.amazonaws.com/enterprise-bank/discovery-server:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8761