apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: enterprise-bank

spec:
  replicas: 1

  selector:
    matchLabels:
      app: discovery-server

  template:
    metadata:
      labels:
        app: discovery-server

    spec:
      containers:
        - name: discovery-server
          image: enterprise-bank/discovery-server:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8761