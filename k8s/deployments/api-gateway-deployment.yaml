apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: enterprise-bank

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: 783772617204.dkr.ecr.ca-central-1.amazonaws.com/enterprise-bank/api-gateway:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: banking-common-config
                  key: CONFIG_SERVER_URL

            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef:
                  name: banking-common-config
                  key: EUREKA_SERVER_URL