apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: enterprise-bank

spec:
  replicas: 1

  selector:
    matchLabels:
      app: config-server

  template:
    metadata:
      labels:
        app: config-server

    spec:
      containers:
        - name: config-server
          image: enterprise-bank/config-server:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8888

          env:
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef:
                  name: banking-common-config
                  key: EUREKA_SERVER_URL