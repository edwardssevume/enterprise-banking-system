server:
  port: 8083

spring:
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:mysql://localhost:3306/account_db?createDatabaseIfNotExist=true}
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: enterprise-banking-auth-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html