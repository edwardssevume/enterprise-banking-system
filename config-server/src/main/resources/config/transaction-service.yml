server:
  port: 8084

spring:
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:mysql://localhost:3306/transaction_db?createDatabaseIfNotExist=true}
    username: root
    password: ${MYSQL_PASSWORD}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: enterprise-banking-auth-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html