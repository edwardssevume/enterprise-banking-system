server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            # =========================
            # APPLICATION API ROUTES
            # =========================

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**

            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**

            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**


            # =========================
            # OPENAPI DOCUMENTATION
            # =========================

            - id: auth-service-docs
              uri: lb://auth-service
              predicates:
                - Path=/auth-service/v3/api-docs
              filters:
                - RewritePath=/auth-service/v3/api-docs, /v3/api-docs

            - id: customer-service-docs
              uri: lb://customer-service
              predicates:
                - Path=/customer-service/v3/api-docs
              filters:
                - RewritePath=/customer-service/v3/api-docs, /v3/api-docs

            - id: account-service-docs
              uri: lb://account-service
              predicates:
                - Path=/account-service/v3/api-docs
              filters:
                - RewritePath=/account-service/v3/api-docs, /v3/api-docs

            - id: transaction-service-docs
              uri: lb://transaction-service
              predicates:
                - Path=/transaction-service/v3/api-docs
              filters:
                - RewritePath=/transaction-service/v3/api-docs, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  tracing:
    sampling:
      probability: 1.0

    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://127.0.0.1:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

    urls:
      - name: Authentication Service
        url: /auth-service/v3/api-docs

      - name: Customer Service
        url: /customer-service/v3/api-docs

      - name: Account Service
        url: /account-service/v3/api-docs

      - name: Transaction Service
        url: /transaction-service/v3/api-docs