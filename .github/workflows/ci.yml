name: Enterprise Banking CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven
        run: mvn -version

      - name: Build and test project
        run: mvn clean test

      - name: Show test error details
        if: failure()
        run: |
          find . -path "*/target/surefire-reports/*.txt" -type f -print -exec cat {} \;