services:

  # =====================================================
  # MYSQL DATABASE
  # =====================================================
  mysql:
    image: mysql:8.4
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - enterprise-bank-mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      - enterprise-bank-network


  # =====================================================
  # DISCOVERY SERVER - EUREKA
  # =====================================================
  discovery-server:
    build:
      context: ./discovery-server

    image: enterprisebank/discovery-server:1.0.0
    container_name: discovery-server

    ports:
      - "8761:8761"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8761/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      - enterprise-bank-network


  # =====================================================
  # CONFIG SERVER
  # =====================================================
  config-server:
    build:
      context: ./config-server

    image: enterprisebank/config-server:1.0.0
    container_name: config-server

    environment:
      EUREKA_URL: "http://discovery-server:8761/eureka/"

    ports:
      - "8888:8888"

    depends_on:
      discovery-server:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8888/actuator/health | grep 'UP' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      - enterprise-bank-network


  # =====================================================
  # AUTH SERVICE
  # =====================================================
  auth-service:
    build:
      context: ./auth-service

    image: enterprisebank/auth-service:1.0.0
    container_name: auth-service

    environment:

      # Config Server
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      CONFIG_SERVER_URL: "http://config-server:8888"
      SPRING_CLOUD_CONFIG_URI: "http://config-server:8888"

      # Eureka
      EUREKA_URL: "http://discovery-server:8761/eureka/"

      # MySQL
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8081:8081"

    depends_on:
      mysql:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/actuator/health | grep 'UP' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - enterprise-bank-network


  # =====================================================
  # CUSTOMER SERVICE
  # =====================================================
  customer-service:
    build:
      context: ./customer-service

    image: enterprisebank/customer-service:1.0.0
    container_name: customer-service

    environment:

      # Config Server
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      CONFIG_SERVER_URL: "http://config-server:8888"
      SPRING_CLOUD_CONFIG_URI: "http://config-server:8888"

      # Eureka
      EUREKA_URL: "http://discovery-server:8761/eureka/"

      # MySQL
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/customer_db?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8082:8082"

    depends_on:
      mysql:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/actuator/health | grep 'UP' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - enterprise-bank-network


  # =====================================================
  # ACCOUNT SERVICE
  # =====================================================
  account-service:
    build:
      context: ./account-service

    image: enterprisebank/account-service:1.0.0
    container_name: account-service

    environment:

      # Config Server
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      CONFIG_SERVER_URL: "http://config-server:8888"
      SPRING_CLOUD_CONFIG_URI: "http://config-server:8888"

      # Eureka
      EUREKA_URL: "http://discovery-server:8761/eureka/"

      # MySQL
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/account_db?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Service-to-service authentication
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}

      # Zipkin Distributed Tracing
      ZIPKIN_URL: "http://zipkin:9411/api/v2/spans"

    ports:
      - "8083:8083"

    depends_on:
      mysql:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

      customer-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8083/actuator/health | grep 'UP' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - enterprise-bank-network


  # =====================================================
  # TRANSACTION SERVICE
  # =====================================================
  transaction-service:
    build:
      context: ./transaction-service

    image: enterprisebank/transaction-service:1.0.0
    container_name: transaction-service

    environment:

      # Config Server
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      CONFIG_SERVER_URL: "http://config-server:8888"
      SPRING_CLOUD_CONFIG_URI: "http://config-server:8888"

      # Eureka
      EUREKA_URL: "http://discovery-server:8761/eureka/"

      # MySQL
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/transaction_db?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Service-to-service authentication
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}

      # Zipkin Distributed Tracing
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans

    ports:
      - "8084:8084"

    depends_on:
      mysql:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

      account-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8084/actuator/health | grep 'UP' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - enterprise-bank-network


  # =====================================================
  # API GATEWAY
  # =====================================================
  api-gateway:
    build:
      context: ./api-gateway

    image: enterprisebank/api-gateway:1.0.0
    container_name: api-gateway

    environment:

      # Config Server
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      CONFIG_SERVER_URL: "http://config-server:8888"
      SPRING_CLOUD_CONFIG_URI: "http://config-server:8888"

      # Eureka
      EUREKA_URL: "http://discovery-server:8761/eureka/"

      ZIPKIN_URL: "http://zipkin:9411/api/v2/spans"

    ports:
      - "8080:8080"

    depends_on:
      discovery-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

      auth-service:
        condition: service_healthy

      customer-service:
        condition: service_healthy

      account-service:
        condition: service_healthy

      transaction-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health | grep 'UP' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - enterprise-bank-network


  # ==========================================
  # PROMETHEUS
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    depends_on:
      api-gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - enterprise-bank-network


  # ==========================================
  # GRAFANA
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Canada@2026!

      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_USER}
      GF_SMTP_FROM_NAME: Enterprise Banking Monitoring
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped

    networks:
      - enterprise-bank-network

  # ==========================================
  # ZIPKIN
  # ==========================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: enterprise-banking-zipkin

    ports:
      - "9411:9411"

    restart: unless-stopped

    networks:
      - enterprise-bank-network

# =====================================================
# DOCKER NETWORK
# =====================================================
networks:

  enterprise-bank-network:
    driver: bridge


# =====================================================
# MYSQL PERSISTENT VOLUME
# =====================================================
volumes:
  enterprise-bank-mysql-data:
    name: enterprise-bank-mysql-data

  grafana-data:
    name: enterprise-bank-grafana-data